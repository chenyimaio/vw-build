name: build-caddy

# 每天北京时间 05:00 检查上游；有新版本就用最新稳定 Go 编译并发布
on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '强制重建（即使同名 release 已存在）'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 查上游最新版本
        id: up
        run: |
          TAG=$(curl -fsSL -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/caddyserver/caddy/releases/latest | jq -r '.tag_name // empty')
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "::error::取上游版本失败"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "上游最新版本: $TAG"

      - name: 判断是否已发布
        id: chk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "caddy-${{ steps.up.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "release caddy-${{ steps.up.outputs.tag }} 已存在，跳过构建"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 安装最新稳定版 Go
        if: steps.chk.outputs.exists == 'false' || inputs.force
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true

      - name: 校验 Go 版本已修复 CVE-2026-111943
        if: steps.chk.outputs.exists == 'false' || inputs.force
        run: |
          set -euo pipefail
          V=$(go env GOVERSION | sed 's/^go//')
          echo "Go 版本: $V"

          # 受影响区间：< 1.26.10，以及 1.27.0 ~ 1.27.2
          LOWER=$(printf '%s\n%s\n' "1.26.10" "$V" | sort -V | head -1)
          if [ "$LOWER" != "1.26.10" ]; then
            echo "::error::Go $V 低于 1.26.10，仍受 CVE-2026-111943 影响，拒绝发布"
            exit 1
          fi
          case "$V" in
            1.27.0|1.27.1|1.27.2)
              echo "::error::Go $V 属于 1.27.0~1.27.2，仍受 CVE-2026-111943 影响，拒绝发布"
              exit 1
              ;;
          esac
          echo "Go $V 已包含修复 ✓"

      - name: 编译 Caddy
        if: steps.chk.outputs.exists == 'false' || inputs.force
        run: |
          set -euo pipefail
          TAG="${{ steps.up.outputs.tag }}"
          GOVER=$(go env GOVERSION | sed 's/^go//')

          curl -fsSL "https://github.com/caddyserver/caddy/archive/refs/tags/${TAG}.tar.gz" -o caddy-src.tgz
          tar xzf caddy-src.tgz
          SRC="caddy-${TAG#v}"
          cd "$SRC"

          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X github.com/caddyserver/caddy/v2.CustomVersion=${TAG}-go${GOVER}" \
            -o ../caddy-linux-amd64 ./cmd/caddy

          cd ..
          chmod +x caddy-linux-amd64
          echo "--- 验证 ---"
          ./caddy-linux-amd64 version
          ./caddy-linux-amd64 build-info | head -1
          sha256sum caddy-linux-amd64 > SHA256SUMS
          ls -lh caddy-linux-amd64

      - name: 发布 Release
        if: steps.chk.outputs.exists == 'false' || inputs.force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${{ steps.up.outputs.tag }}"
          GOVER=$(./caddy-linux-amd64 build-info | head -1 | awk -F'\t' '{print $2}')
          VER=$(./caddy-linux-amd64 version)
          SIZE=$(du -h caddy-linux-amd64 | cut -f1)

          gh release create "caddy-$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "Caddy $TAG ($GOVER)" \
            --notes "## Caddy $TAG

          用 **最新稳定版 Go（$GOVER）** 从源码编译，已包含 CVE-2026-111943 修复。
          官方预编译版本长期落后于最新 Go，所以自建。

          - **版本**: $VER
          - **编译 Go**: $GOVER
          - **大小**: $SIZE
          - **构建时间**: $(date -u '+%F %T UTC')
          - **能力**: core 模块全集（无第三方插件），CGO 关闭（静态可移植）
          - **校验**: \`sha256sum -c SHA256SUMS\`" \
            ./caddy-linux-amd64 ./SHA256SUMS

          echo "已发布 caddy-$TAG"
